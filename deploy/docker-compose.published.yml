name: gamestats

services:
  analytics-scala:
    image: ${GAMESTATS_REGISTRY:?define GAMESTATS_REGISTRY}/gamestats-analytics:${GAMESTATS_TAG:-latest}
    mem_limit: 1g
    environment:
      PORT: "8081"
      RESULTS_DIRECTORY: /data/results
    ports:
      - "8081:8081"
    volumes:
      - analytics-data:/data/results
    restart: unless-stopped

  ingest-go:
    image: ${GAMESTATS_REGISTRY:?define GAMESTATS_REGISTRY}/gamestats-ingest:${GAMESTATS_TAG:-latest}
    mem_limit: 1g
    environment:
      PORT: "8080"
      ANALYTICS_URL: http://analytics-scala:8081
      MATCH_IDLE_TIMEOUT_SECONDS: ${MATCH_IDLE_TIMEOUT_SECONDS:-30}
      MATCH_FINISH_GRACE_MILLISECONDS: ${MATCH_FINISH_GRACE_MILLISECONDS:-500}
      REJECTED_EVENTS_PATH: /data/rejected-events.log
      INBOX_DIRECTORY: /inbox
      ANALYTICS_MAX_ATTEMPTS: ${ANALYTICS_MAX_ATTEMPTS:-6}
      ANALYTICS_INITIAL_BACKOFF_MILLISECONDS: ${ANALYTICS_INITIAL_BACKOFF_MILLISECONDS:-500}
    ports:
      - "8080:8080"
    volumes:
      - ingest-data:/data
      - inbox-data:/inbox
    depends_on:
      analytics-scala:
        condition: service_healthy
    stop_grace_period: 50s
    restart: unless-stopped

  simulator:
    image: ${GAMESTATS_REGISTRY:?define GAMESTATS_REGISTRY}/gamestats-simulator:${GAMESTATS_TAG:-latest}
    profiles: ["simulation"]
    environment:
      SIMULATOR_TARGET_URL: http://ingest-go:8080
      SIMULATOR_SCENARIO: ${SIMULATOR_SCENARIO:-mixed-parallel}
      SIMULATOR_RUN_ID: ${SIMULATOR_RUN_ID:-demo}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-42}
      SIMULATOR_MATCHES_PER_GAME: ${SIMULATOR_MATCHES_PER_GAME:-0}
      SIMULATOR_EVENTS_PER_SECOND: ${SIMULATOR_EVENTS_PER_SECOND:-0}
      SIMULATOR_OUTPUT_DIRECTORY: ${SIMULATOR_OUTPUT_DIRECTORY:-}
    volumes:
      - inbox-data:/inbox
    depends_on:
      ingest-go:
        condition: service_healthy
    restart: "no"

volumes:
  ingest-data:
  analytics-data:
  inbox-data:
