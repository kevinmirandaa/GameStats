name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-modules:
    name: Go ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [ingest-go, simulator]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Formato
        run: test -z "$(gofmt -l .)"
      - name: Analisis estatico
        run: go vet ./...
      - name: Pruebas con detector de carreras
        run: go test -race -count=1 ./...

  scala-module:
    name: Scala analytics-scala
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: analytics-scala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compilar y probar
        run: sbt -batch test
      - name: Empaquetar
        run: sbt -batch stage

  coding-standards:
    name: Estandares de codigo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Revisar estandares
        run: ./qa/check-standards.sh

  containers-and-smoke-test:
    name: Contenedores y prueba de humo
    needs: [go-modules, scala-module]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagenes, levantar el sistema y verificarlo
        env:
          KEEP_UP: "1"
        run: make smoke
      - name: Registros de los contenedores
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile simulation logs --no-color
