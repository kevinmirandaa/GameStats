name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-modules:
    name: Go ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [ingest-go, simulator]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Formato
        run: test -z "$(gofmt -l .)"
      - name: Analisis estatico
        run: go vet ./...
      - name: Pruebas con detector de carreras
        run: go test -race -count=1 ./...

  scala-module:
    name: Scala analytics-scala
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: analytics-scala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compilar y probar
        run: sbt -batch test
      - name: Empaquetar
        run: sbt -batch stage

  console-module:
    name: Java console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar
        run: mvn -B verify

  prolog-module:
    name: Prolog prolog-ai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas plunit dentro de la imagen
        run: docker build --target verified -t gamestats-prolog-test prolog-ai

  coding-standards:
    name: Estandares de codigo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Revisar estandares
        run: ./qa/check-standards.sh

  containers-and-smoke-test:
    name: Contenedores y prueba de humo
    needs: [go-modules, scala-module, console-module, prolog-module]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagenes, levantar el sistema y verificarlo
        env:
          KEEP_UP: "1"
        run: make smoke
      - name: Registros de los contenedores
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile simulation logs --no-color

  console-end-to-end:
    name: Consola integrada de extremo a extremo
    needs: [go-modules, scala-module, console-module, prolog-module]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir y levantar el sistema completo
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait
      - name: Partidas de demostracion a traves de la consola
        run: docker compose -f deploy/docker-compose.yml --profile demo run --rm demo
      - name: Prueba de extremo a extremo
        run: python3 qa/console_e2e.py
      - name: Registros de los contenedores
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile demo logs --no-color
      - name: Detener
        if: always()
        run: docker compose -f deploy/docker-compose.yml --profile demo down --volumes --remove-orphans
